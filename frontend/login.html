<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livraria Folha — Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap header-inner">
      <a href="index.html" class="brand">Livraria Folha</a>
      <nav class="main-nav">
        <a href="index.html">Catálogo</a>
        <a href="cadastro.html">Cadastrar livro</a>
        <a href="login.html">Entrar</a>
      </nav>
    </div>
  </header>

  <main class="wrap page-form page-form--narrow">
    <h1 class="page-title">Entrar</h1>
    <p class="page-sub">Área restrita da equipe da livraria. Login só de validação — ainda não há back-end conectado.</p>

    <form id="form-login" class="form" novalidate>

      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="voce@livraria.com">
        <span class="field-error" id="erro-email"></span>
      </div>

      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres">
        <span class="field-error" id="erro-senha"></span>
      </div>

      <p class="form-msg" id="form-msg" hidden></p>

      <div class="form-actions">
        <button type="submit" class="btn-primary">Entrar</button>
      </div>

    </form>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Livraria Folha — projeto de estudo, sistema de cadastro de livros.</p>
    </div>
  </footer>

  <script src="validacao.js"></script>
  <script src="main.js"></script>
</body>
</html>
